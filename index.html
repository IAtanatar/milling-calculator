<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор фрезеровки</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --bg: #f0f2f5; 
            --card-bg: #ffffff; 
            --text: #1a1a1a;
            --muted: #666666;
            --border: #d1d5db;
            --input-bg: #f9fafb;
            --canvas-bg: #e5e7eb; 
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            
            --mdf-fill: #ffffff; 
            --mdf-hatch: rgba(44, 62, 80, 0.35);
            --mdf-stroke: #2c3e50;
            --axis-color: rgba(231, 76, 60, 0.6);
            --dim-color: #004494;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 400px;
            min-width: 400px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 14px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 2;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-content {
            padding: 12px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tg-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #ffffff;
            background: var(--primary);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            font-weight: 700;
            display: block;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .input-row:last-child { margin-bottom: 0; }
        .input-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        .col-select { flex: 1.8; }
        .col-small { flex: 1; }

        label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        input, select {
            width: 100%;
            padding: 6px 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23707579%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px top 50%;
            background-size: 10px auto;
            padding-right: 24px;
        }

        input:focus, select:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.1);
        }

        .preset-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .btn-icon-small {
            background: #e5e7eb;
            color: var(--primary);
            border: none;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-icon-small:hover { background: #d1d5db; }
        .btn-icon-small svg { width: 16px; height: 16px; fill: currentColor; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            font-size: 0.85rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            background: var(--input-bg);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .info-val { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .info-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 600;}

        .sidebar-footer {
            padding: 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            z-index: 2;
        }

        .download-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 4px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary { background: #e5e7eb; color: var(--primary); }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-secondary:active { transform: scale(0.98); }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }

        .viewer {
            flex-grow: 1;
            position: relative;
            background: var(--canvas-bg);
            overflow: hidden; 
        }

        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }

        .viewer-toolbar { 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            z-index: 5; 
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .viewer-control {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .viewer-control:hover { background: #f9fafb; }
        .viewer-control svg { width: 14px; height: 14px; fill: currentColor; }
        
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Калькулятор фрезеровки</h1>
        </div>
        
        <div class="sidebar-content" id="form-container">
            
            <div class="tg-card">
                <span class="section-title">Библиотека шаблонов</span>
                <div class="preset-row">
                    <select id="presetSelect" style="flex-grow: 1; font-weight: 600;">
                        <option value="custom">Пользовательский</option>
                    </select>
                    <button class="btn-icon-small" id="btnAddPreset" title="Создать новый шаблон (+)">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </button>
                    <button class="btn-icon-small" id="btnSavePreset" title="Перезаписать текущий">
                        <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                    </button>
                </div>
            </div>

            <div class="tg-card">
                <span class="section-title">Геометрия и Инструмент</span>
                <div class="input-row">
                    <div class="input-col"><label>Ширина (W)</label><input type="number" id="W" value="600" step="1"></div>
                    <div class="input-col"><label>Высота (H)</label><input type="number" id="H" value="716" step="1"></div>
                    <div class="input-col"><label>Толщ. (T)</label><input type="number" id="thickness" value="19" min="6" step="1"></div>
                </div>
                
                <div class="input-row">
                    <div class="input-col col-select">
                        <label>Тип фрезы</label>
                        <select id="toolType">
                            <option value="spherical">Сферическая</option>
                            <option value="straight">Пазовая</option>
                            <option value="cone">Конусная 90°</option>
                        </select>
                    </div>
                    <div class="input-col col-small"><label>Ø (D)</label><input type="number" id="D" value="10" min="1" step="0.1"></div>
                    <div class="input-col col-small"><label>Глуб. (Z)</label><input type="number" id="depth" value="2" min="0.1" step="0.1"></div>
                </div>

                <div class="input-row" style="margin-top: 10px;">
                    <div class="input-col"><label>Отст. Лев (X1)</label><input type="number" id="marginLeft" value="4" step="1"></div>
                    <div class="input-col"><label>Отст. Прав (X2)</label><input type="number" id="marginRight" value="4" step="1"></div>
                    <div class="input-col"><label>Желаемая полка</label><input type="number" id="flatDesired" value="3" min="0" step="0.1"></div>
                </div>
            </div>

            <div class="tg-card">
                <span class="section-title">Результат расчета</span>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Кол-во пазов</span>
                        <span class="info-val" id="outN">0 шт.</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Ширина паза</span>
                        <span class="info-val" id="outWcut">0.00 мм</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Факт. полка</span>
                        <span class="info-val" id="outFlat">0.00 мм</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Шаг фрезы</span>
                        <span class="info-val" id="outStep">0.00 мм</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <span class="section-title">Экспорт DXF</span>
            <div class="download-row">
                <button class="btn btn-primary" id="btnDownloadToolpath" title="DXF файл с осевыми линиями движения инструмента">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    Траектория
                </button>
                <button class="btn btn-secondary" id="btnDownloadProfile" title="DXF файл с полилинией профиля фасада">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                    Сечение
                </button>
            </div>
        </div>
    </aside>

    <main class="viewer" id="viewer">
        <div class="viewer-toolbar">
            <label class="viewer-control">
                <input type="checkbox" id="chkDimensions" checked>
                Показывать размеры
            </label>
            <button class="viewer-control" id="btnFit" style="border: none;">
                <svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                Вписать в экран
            </button>
        </div>
        <canvas id="canvas"></canvas>
    </main>
</div>

<script>
    const defaultPresets = {
        "geo1": { name: "Геометрия 1", toolType: "straight", D: 15, depth: 4, marginLeft: 15, marginRight: 15, flatDesired: 15 },
        "geo2": { name: "Геометрия 2", toolType: "straight", D: 15, depth: 1.5, marginLeft: 15, marginRight: 15, flatDesired: 15 },
        "geo3": { name: "Геометрия 3", toolType: "spherical", D: 10, depth: 2, marginLeft: 4, marginRight: 4, flatDesired: 3 },
        "geo4": { name: "Геометрия 4", toolType: "spherical", D: 6, depth: 1.5, marginLeft: 4, marginRight: 4, flatDesired: 3 },
        "geo5": { name: "Геометрия 5", toolType: "spherical", D: 50, depth: 4, marginLeft: 4, marginRight: 4, flatDesired: 3 },
        "geo7": { name: "Геометрия 7", toolType: "cone", D: 14, depth: 7, marginLeft: -7, marginRight: -7, flatDesired: 0 },
        "geo8": { name: "Геометрия 8", toolType: "spherical", D: 25, depth: 4, marginLeft: 4, marginRight: 4, flatDesired: 3 }
    };
    
    let presets = JSON.parse(localStorage.getItem('wavePresetsLight')) || defaultPresets;
    const presetSelect = document.getElementById('presetSelect');

    function renderPresetsList() {
        const currentVal = presetSelect.value;
        presetSelect.innerHTML = '<option value="custom">Пользовательский</option>';
        for (let key in presets) {
            let opt = document.createElement('option');
            opt.value = key;
            opt.textContent = presets[key].name;
            presetSelect.appendChild(opt);
        }
        if (presets[currentVal] || currentVal === 'custom') {
            presetSelect.value = currentVal;
        }
    }

    presetSelect.addEventListener('change', (e) => {
        const key = e.target.value;
        if (key !== 'custom' && presets[key]) {
            const p = presets[key];
            document.getElementById('toolType').value = p.toolType;
            document.getElementById('D').value = p.D;
            document.getElementById('depth').value = p.depth;
            document.getElementById('marginLeft').value = p.marginLeft;
            document.getElementById('marginRight').value = p.marginRight;
            document.getElementById('flatDesired').value = p.flatDesired;
            calculate();
        }
    });

    document.getElementById('btnAddPreset').addEventListener('click', () => {
        const name = prompt("Введите название для нового шаблона:");
        if (!name || name.trim() === "") return;
        
        const key = 'preset_' + Date.now();
        presets[key] = {
            name: name.trim(),
            toolType: document.getElementById('toolType').value,
            D: parseFloat(document.getElementById('D').value),
            depth: parseFloat(document.getElementById('depth').value),
            marginLeft: parseFloat(document.getElementById('marginLeft').value),
            marginRight: parseFloat(document.getElementById('marginRight').value),
            flatDesired: parseFloat(document.getElementById('flatDesired').value)
        };
        
        localStorage.setItem('wavePresetsLight', JSON.stringify(presets));
        renderPresetsList();
        presetSelect.value = key;
    });

    document.getElementById('btnSavePreset').addEventListener('click', () => {
        const key = presetSelect.value;
        if (key === 'custom') {
            document.getElementById('btnAddPreset').click();
            return;
        }
        
        presets[key] = {
            name: presets[key].name, 
            toolType: document.getElementById('toolType').value,
            D: parseFloat(document.getElementById('D').value),
            depth: parseFloat(document.getElementById('depth').value),
            marginLeft: parseFloat(document.getElementById('marginLeft').value),
            marginRight: parseFloat(document.getElementById('marginRight').value),
            flatDesired: parseFloat(document.getElementById('flatDesired').value)
        };
        localStorage.setItem('wavePresetsLight', JSON.stringify(presets));
        
        const btn = document.getElementById('btnSavePreset');
        const oldColor = btn.style.color;
        btn.style.color = '#28a745'; 
        setTimeout(() => btn.style.color = oldColor, 500);
    });

    const state = {
        centers: [], topEntities: [], calc: {}, transform: { x: 0, y: 0, scale: 1 },
        isDragging: false, lastMouse: { x: 0, y: 0 }, hatchCanvas: null
    };

    const inputs = document.querySelectorAll('#form-container input, #form-container select:not(#presetSelect)');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const viewer = document.getElementById('viewer');
    
    const elOutN = document.getElementById('outN');
    const elOutWcut = document.getElementById('outWcut');
    const elOutFlat = document.getElementById('outFlat');
    const elOutStep = document.getElementById('outStep');
    const chkDimensions = document.getElementById('chkDimensions');

    function getHatchPatternCanvas() {
        if (state.hatchCanvas) return state.hatchCanvas;
        const pSize = 24; 
        const patCanvas = document.createElement('canvas');
        patCanvas.width = pSize; patCanvas.height = pSize;
        const pCtx = patCanvas.getContext('2d');
        
        const color = getComputedStyle(document.body).getPropertyValue('--mdf-hatch').trim();
        pCtx.strokeStyle = color; 
        pCtx.lineWidth = 1.5; pCtx.lineCap = 'square';
        
        pCtx.beginPath();
        pCtx.moveTo(0, 0); pCtx.lineTo(pSize, pSize);
        pCtx.moveTo(0, pSize); pCtx.lineTo(pSize, pSize*2);
        pCtx.moveTo(0, -pSize); pCtx.lineTo(pSize, 0);
        pCtx.stroke();
        
        state.hatchCanvas = patCanvas;
        return patCanvas;
    }

    function calculate() {
        const W = parseFloat(document.getElementById('W').value) || 0;
        const H = parseFloat(document.getElementById('H').value) || 0;
        const T = parseFloat(document.getElementById('thickness').value) || 0;
        const toolType = document.getElementById('toolType').value;
        const D = parseFloat(document.getElementById('D').value) || 0.1;
        const depth = parseFloat(document.getElementById('depth').value) || 0.1;
        const marginLeft = parseFloat(document.getElementById('marginLeft').value) || 0;
        const marginRight = parseFloat(document.getElementById('marginRight').value) || 0;
        const flatDesired = parseFloat(document.getElementById('flatDesired').value) || 0;

        let Wcut = 0;
        if (toolType === 'straight') Wcut = D;
        else if (toolType === 'spherical') {
            const r = D / 2; const d = Math.min(depth, r); 
            Wcut = 2 * Math.sqrt(Math.max(0, d * (D - d)));
        } else if (toolType === 'cone') Wcut = 2 * depth; 

        const availW = W - (marginLeft + marginRight); 
        let N = Math.round((availW + flatDesired) / (Wcut + flatDesired));
        if (N < 1) N = 1;

        let actualFlat = 0;
        if (N > 1) actualFlat = (availW - (N * Wcut)) / (N - 1);

        const centers = [];
        let currentX = marginLeft + (Wcut / 2);
        for (let i = 0; i < N; i++) {
            centers.push(currentX);
            currentX += Wcut + actualFlat;
        }

        const step = Wcut + actualFlat;
        const entities = [];
        
        function addFlatLine(x1, x2) {
            let cx1 = Math.max(0, Math.min(W, x1)); let cx2 = Math.max(0, Math.min(W, x2));
            if (cx2 - cx1 > 0.001) entities.push({ type: 'LINE', x1: cx1, y1: T, x2: cx2, y2: T });
        }

        let prevEndX = -9999;

        centers.forEach(cx => {
            const xs = cx - Wcut / 2; const xe = cx + Wcut / 2;
            addFlatLine(prevEndX === -9999 ? 0 : prevEndX, xs);
            
            if (xs < W && xe > 0) { 
                if (toolType === 'straight') {
                    const cx1 = Math.max(0, xs); const cx2 = Math.min(W, xe);
                    if (xs >= 0 && xs <= W) entities.push({ type: 'LINE', x1: xs, y1: T, x2: xs, y2: T - depth });
                    if (cx1 < cx2) entities.push({ type: 'LINE', x1: cx1, y1: T - depth, x2: cx2, y2: T - depth });
                    if (xe >= 0 && xe <= W) entities.push({ type: 'LINE', x1: xe, y1: T - depth, x2: xe, y2: T });
                } else if (toolType === 'cone') {
                    let intersects = (x1, y1, x2, y2) => {
                        if (x2 <= 0 || x1 >= W) return null;
                        let cx1 = Math.max(0, x1); let cy1 = y1 + (y2 - y1) * (cx1 - x1) / (x2 - x1);
                        let cx2 = Math.min(W, x2); let cy2 = y1 + (y2 - y1) * (cx2 - x1) / (x2 - x1);
                        if (cx2 - cx1 > 0.001) return { x1: cx1, y1: cy1, x2: cx2, y2: cy2 };
                        return null;
                    };
                    let leftSlope = intersects(xs, T, cx, T - depth);
                    if (leftSlope) entities.push({ type: 'LINE', ...leftSlope });
                    let rightSlope = intersects(cx, T - depth, xe, T);
                    if (rightSlope) entities.push({ type: 'LINE', ...rightSlope });
                } else if (toolType === 'spherical') {
                    const R = D / 2; const cy = T - depth + R;
                    let clip_xs = Math.max(0, xs); let clip_xe = Math.min(W, xe);
                    
                    if (clip_xs < clip_xe) {
                        const getAngleRad = (x) => {
                            const dx = x - cx; const dy = -Math.sqrt(Math.max(0, R*R - dx*dx));
                            return Math.atan2(dy, dx);
                        };
                        const startRad = getAngleRad(clip_xs); const endRad = getAngleRad(clip_xe);
                        let startDeg = startRad * 180 / Math.PI; let endDeg = endRad * 180 / Math.PI;
                        if (startDeg < 0) startDeg += 360; if (endDeg < 0) endDeg += 360;
                        entities.push({ 
                            type: 'ARC', cx: cx, cy: cy, r: R, 
                            startRad, endRad, startDeg, endDeg,
                            x1: clip_xs, y1: cy + R * Math.sin(startRad),
                            x2: clip_xe, y2: cy + R * Math.sin(endRad)
                        });
                    }
                }
            }
            prevEndX = xe;
        });
        
        addFlatLine(prevEndX === -9999 ? 0 : prevEndX, W);

        const isFirstRun = !state.calc.W;
        state.calc = { N, Wcut, actualFlat, step, W, H, T, toolType, D, depth, marginLeft, marginRight };
        state.centers = centers;
        state.topEntities = entities;

        elOutN.textContent = `${N}`;
        elOutWcut.textContent = `${Wcut.toFixed(2)}`;
        elOutFlat.textContent = `${Math.max(0, actualFlat).toFixed(2)}`;
        elOutStep.textContent = `${step.toFixed(2)}`;

        if (isFirstRun) fitToScreen();
        else draw();
    }

    function fitToScreen() {
        const { W } = state.calc;
        const padding = 120; 
        const viewW = viewer.clientWidth; const viewH = viewer.clientHeight;
        if (W <= 0) return;
        state.transform.scale = (viewW - padding * 2) / W;
        state.transform.x = viewW / 2;
        state.transform.y = viewH / 2;
        draw();
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            state.isDragging = true; state.lastMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', (e) => {
            if (!state.isDragging) return;
            state.transform.x += e.clientX - state.lastMouse.x;
            state.transform.y += e.clientY - state.lastMouse.y;
            state.lastMouse = { x: e.clientX, y: e.clientY };
            draw();
        });
        window.addEventListener('mouseup', () => { state.isDragging = false; });
        window.addEventListener('mouseleave', () => { state.isDragging = false; });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9; 
            state.transform.x = mouseX - (mouseX - state.transform.x) * zoomFactor;
            state.transform.y = mouseY - (mouseY - state.transform.y) * zoomFactor;
            state.transform.scale *= zoomFactor;
            draw();
        }, { passive: false });
        
        chkDimensions.addEventListener('change', draw);
    }

    function drawDimensions(ctx) {
        const { W, T, depth, marginLeft, marginRight, D, step, actualFlat, Wcut } = state.calc;
        const centers = state.centers;
        if (centers.length === 0) return;

        const dimScale = 1 / state.transform.scale;
        const dimColor = getComputedStyle(document.body).getPropertyValue('--dim-color').trim();

        ctx.strokeStyle = dimColor;
        ctx.fillStyle = dimColor;
        ctx.lineWidth = 1 * dimScale;

        function drawText(txt, x, y, isVert = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(1, -1);
            
            const fontSize = 14 / state.transform.scale;
            ctx.font = `600 ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (isVert) {
                ctx.rotate(-Math.PI / 2);
            }

            const tw = ctx.measureText(txt).width;
            const th = fontSize;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(-tw/2 - 4*dimScale, -th/2 - 2*dimScale, tw + 8*dimScale, th + 4*dimScale);

            ctx.fillStyle = dimColor;
            ctx.fillText(txt, 0, 0);
            ctx.restore();
        }

        function drawTick(x, y) {
            const s = 4 * dimScale;
            ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.stroke();
        }

        function drawHorizDim(x1, x2, yOffset, text) {
            if (Math.abs(x2 - x1) < 0.1) return;
            const y = T + yOffset * dimScale;
            
            ctx.beginPath();
            ctx.moveTo(x1, T); ctx.lineTo(x1, y + 6 * dimScale);
            ctx.moveTo(x2, T); ctx.lineTo(x2, y + 6 * dimScale);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x1, y); ctx.lineTo(x2, y);
            ctx.stroke();

            drawTick(x1, y);
            drawTick(x2, y);

            drawText(text, (x1 + x2)/2, y);
        }

        function drawVertDim(y1, y2, x, text) {
            const extX = x - 25 * dimScale; 
            
            ctx.beginPath();
            ctx.moveTo(0, y1); ctx.lineTo(extX - 6 * dimScale, y1);
            ctx.moveTo(0, y2); ctx.lineTo(extX - 6 * dimScale, y2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(extX, y1); ctx.lineTo(extX, y2);
            ctx.stroke();

            drawTick(extX, y1);
            drawTick(extX, y2);

            drawText(text, extX, (y1 + y2)/2, true);
        }

        // УРОВЕНЬ 1 (Y = 35): Отступы, Ширина первого паза и Полка (Цепной размер)
        const firstCutLeft = Math.max(0, centers[0] - Wcut/2);
        drawHorizDim(0, firstCutLeft, 35, `${marginLeft.toFixed(1)}`);

        const firstCutRight = Math.min(W, centers[0] + Wcut/2);
        drawHorizDim(firstCutLeft, firstCutRight, 35, `${Wcut.toFixed(1)}`);

        if (centers.length > 1 && actualFlat > 0.1) {
            const secondCutLeft = Math.max(0, centers[1] - Wcut/2);
            drawHorizDim(firstCutRight, secondCutLeft, 35, `${actualFlat.toFixed(1)}`);
        }

        const lastCutRight = Math.min(W, centers[centers.length - 1] + Wcut/2);
        drawHorizDim(lastCutRight, W, 35, `${marginRight.toFixed(1)}`);

        // УРОВЕНЬ 2 (Y = 75): Шаг фрезы (между 2 и 3 проходом, либо 1 и 2)
        if (centers.length > 1) {
            const stepIdx = centers.length >= 3 ? 1 : 0;
            drawHorizDim(centers[stepIdx], centers[stepIdx + 1], 75, `Шаг: ${step.toFixed(1)}`);
        }

        // ВЕРТИКАЛЬ: Глубина Z
        drawVertDim(T, T - depth, 0, `Z: ${depth.toFixed(1)}`);
        
        // Инструмент (Только диаметр для всех фрез)
        ctx.save();
        ctx.translate(W / 2, T + 120 * dimScale);
        ctx.scale(1, -1);
        const fontSize = 14 / state.transform.scale;
        ctx.font = `italic 600 ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#d35400'; 
        ctx.fillText(`Фреза: Ø${D.toFixed(1)}`, 0, 0);
        ctx.restore();
    }

    function draw() {
        const { W, T, depth, D } = state.calc; const entities = state.topEntities;
        if (!entities || entities.length === 0) return;

        const canvasW = viewer.clientWidth; const canvasH = viewer.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvasW * dpr; canvas.height = canvasH * dpr;
        canvas.style.width = `${canvasW}px`; canvas.style.height = `${canvasH}px`;
        ctx.scale(dpr, dpr); ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.save();
        
        ctx.translate(state.transform.x, state.transform.y);
        ctx.scale(state.transform.scale, -state.transform.scale); 
        ctx.translate(-W / 2, -T / 2);

        ctx.beginPath();
        ctx.moveTo(0, 0); 
        ctx.lineTo(0, entities[0].y1);
        entities.forEach(ent => {
            if (ent.type === 'LINE') ctx.lineTo(ent.x2, ent.y2);
            else if (ent.type === 'ARC') ctx.arc(ent.cx, ent.cy, ent.r, ent.startRad, ent.endRad, false);
        });
        ctx.lineTo(W, entities[entities.length - 1].y2); 
        ctx.lineTo(W, 0); 
        ctx.closePath(); 

        const fillColor = getComputedStyle(document.body).getPropertyValue('--mdf-fill').trim();
        ctx.fillStyle = fillColor;
        ctx.fill();

        const pattern = ctx.createPattern(getHatchPatternCanvas(), 'repeat');
        const matrix = new DOMMatrix();
        matrix.scaleSelf(1 / state.transform.scale, -1 / state.transform.scale);
        pattern.setTransform(matrix);
        ctx.fillStyle = pattern; 
        ctx.fill();
        
        const strokeColor = getComputedStyle(document.body).getPropertyValue('--mdf-stroke').trim();
        ctx.lineWidth = 1.5 / state.transform.scale;
        ctx.strokeStyle = strokeColor;
        ctx.lineJoin = 'round'; ctx.stroke();

        const axisColor = getComputedStyle(document.body).getPropertyValue('--axis-color').trim();
        ctx.lineWidth = 1 / state.transform.scale;
        ctx.strokeStyle = axisColor; 
        ctx.setLineDash([8 / state.transform.scale, 6 / state.transform.scale]);
        ctx.beginPath();
        state.centers.forEach(cx => {
            if (cx >= -D/2 && cx <= W + D/2) {
                ctx.moveTo(cx, T + 10 / state.transform.scale); 
                ctx.lineTo(cx, T - depth - 5 / state.transform.scale);
            }
        });
        ctx.stroke(); ctx.setLineDash([]); 
        
        if (chkDimensions.checked) {
            drawDimensions(ctx);
        }

        ctx.restore();
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none'; a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        window.URL.revokeObjectURL(url); document.body.removeChild(a);
    }

    function createDXFLine(x1, y1, x2, y2) { return `  0\nLINE\n  8\nProfile\n 10\n${x1.toFixed(3)}\n 20\n${y1.toFixed(3)}\n 30\n0.0\n 11\n${x2.toFixed(3)}\n 21\n${y2.toFixed(3)}\n 31\n0.0\n`; }
    function createDXFArc(cx, cy, r, startDeg, endDeg) { return `  0\nARC\n  8\nProfile\n 10\n${cx.toFixed(3)}\n 20\n${cy.toFixed(3)}\n 30\n0.0\n 40\n${r.toFixed(3)}\n 50\n${startDeg.toFixed(3)}\n 51\n${endDeg.toFixed(3)}\n`; }

    function generateDXFToolpath() {
        const H = parseFloat(document.getElementById('H').value) || 0;
        let dxfString = `  0\nSECTION\n  2\nENTITIES\n`;
        state.centers.forEach(cx => {
            const x = cx.toFixed(3);
            dxfString += `  0\nLINE\n  8\nToolpath\n 10\n${x}\n 20\n0.000\n 30\n0.0\n 11\n${x}\n 21\n${H.toFixed(3)}\n 31\n0.0\n`;
        });
        dxfString += `  0\nENDSEC\n  0\nEOF\n`;
        downloadFile(dxfString, `toolpath_wave_${document.getElementById('W').value}x${H}.dxf`);
    }

    function generateDXFProfile() {
        let dxfString = `  0\nSECTION\n  2\nENTITIES\n`;
        const entities = state.topEntities; const { W, T } = state.calc;
        const leftY = entities.length > 0 ? entities[0].y1 : T;
        const rightY = entities.length > 0 ? entities[entities.length - 1].y2 : T;

        dxfString += createDXFLine(W, rightY, W, 0) + createDXFLine(W, 0, 0, 0) + createDXFLine(0, 0, 0, leftY);
        entities.forEach(ent => {
            if (ent.type === 'LINE') dxfString += createDXFLine(ent.x1, ent.y1, ent.x2, ent.y2);
            else if (ent.type === 'ARC') dxfString += createDXFArc(ent.cx, ent.cy, ent.r, ent.startDeg, ent.endDeg);
        });
        dxfString += `  0\nENDSEC\n  0\nEOF\n`;
        downloadFile(dxfString, `profile_wave_W${W}_T${T}.dxf`);
    }

    inputs.forEach(input => {
        input.addEventListener('input', () => {
            presetSelect.value = 'custom';
            calculate();
        });
    });
    
    document.getElementById('btnDownloadToolpath').addEventListener('click', generateDXFToolpath);
    document.getElementById('btnDownloadProfile').addEventListener('click', generateDXFProfile);
    document.getElementById('btnFit').addEventListener('click', fitToScreen);
    window.addEventListener('resize', fitToScreen);

    renderPresetsList();
    presetSelect.value = "geo1"; 
    presetSelect.dispatchEvent(new Event('change'));
    setupInteraction(); 

</script>
</body>
</html>
